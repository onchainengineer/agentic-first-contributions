# Tracked projects for the live status update script.
#
# To add a project:
#   1. Verify it meets the criteria in CONTRIBUTING.md
#   2. Add an entry here with owner/repo format
#   3. Set the category and language
#   4. Open a PR
#
# The fetch-issues.py script queries GitHub API for each of these
# and updates projects/live-status.md with current counts.

